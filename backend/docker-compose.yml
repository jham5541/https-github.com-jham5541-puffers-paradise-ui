services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: puffers
      POSTGRES_PASSWORD: puffers_dev_only
      POSTGRES_DB: empire_city
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
